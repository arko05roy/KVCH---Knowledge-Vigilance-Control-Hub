<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KVCH Real Empirical Risk Intelligence Dashboard</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #090a0c;
      color: #f7f8f8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      max-width: 1320px;
      width: 100%;
    }
    .header {
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .badge {
      background: #1b2e23;
      border: 1px solid #10b981;
      color: #34d399;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
    }
    .svg-wrapper {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      border: 1px solid #23252a;
    }
    .svg-wrapper img {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h1 style="margin: 0; font-size: 24px;">KVCH Risk Intelligence — Real Empirical Dataset Evaluation</h1>
        <p style="margin: 4px 0 0 0; color: #8a8f98; font-size: 14px;">Plotted directly from 10 Verizon VCDB Logs &amp; 4 CVE Scenario Contracts</p>
      </div>
      <div class="badge">&#x2713; 100% Real Data Grounding</div>
    </div>
    <div class="svg-wrapper">
      <img src="./real_empirical_data_charts.svg" alt="KVCH Real Empirical Data Chart" />
    </div>
  </div>
</body>
</html>
