schema_version: kvch.extension-package/v1
id: vpn-crypto-analyzer
name: VPN Crypto Analyzer
version: 1.0.0
description: Analyzes VPN network traffic and crypto algorithms from laptop PCAP files or network interfaces.

implementation:
  language: python
  runtime: python >=3.11
  package_manager: pip
  entrypoint: src/main.py

commands:
  install: pip install -r requirements.txt
  run: python src/main.py
  test: pytest tests/
  build: python -m build
  package: python -m build

interface:
  mode: cli
  inputs:
    - name: pcap_file
      description: Path to PCAP file (optional, live capture if not provided)
      required: false
  outputs:
    - name: findings
      description: JSON Finding Envelope with VPN crypto analysis results

behavior:
  normal: Strong IPsec/IKE encryption algorithms (AES-256-GCM, DH Group 14+)
  concern: Weak cipher suites (3DES, DES, MD5, DH Groups 1, 2, 5)
  edge_cases:
    - Missing tshark or pyshark dependency
    - Empty PCAP file or unreadable interface

deployment:
  schedule: "0 * * * *"

dependencies:
  runtime: [pyshark]
  system: [tshark, tcpdump]
  configuration: []

runtime_compatibility:
  supports_graceful_stop: true
  operation_boundaries: [parse_pcap, analyze_ike, score_crypto, classify_traffic]
  credentials: injected_at_runtime
