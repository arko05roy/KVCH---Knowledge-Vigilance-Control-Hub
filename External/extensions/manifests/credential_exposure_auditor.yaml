identity:
  name: "Digital Asset & Credential Exposure Auditor"
  type: "report"
  creator: "external-threat-team"
  edit_access: 
    - "external-threat-team"
    - "security-team"
    - "endpoint-security"
  target_scope: "Installed browser extensions, client web scripts, and digital asset transaction buffers"

intent:
  what_is_normal: |
    - Browser extensions operate within declared functional scope (e.g. utilities stay strictly within sandboxed utility functions).
    - No interception of clipboard buffers during cryptocurrency or sensitive operations.
    - Zero scraping or exfiltration of seed phrases, mnemonic lists, or private keys.
    - Web3 wallet interfaces (window.ethereum) operate untampered.
  
  what_is_not_normal: |
    - Clipboard listeners rewriting destination addresses during copy/paste.
    - Utility extensions (PDF readers, OCR converters, calculators) requesting broad host access (<all_urls>) or clipboardRead/clipboardWrite.
    - Script injections attempting to hook window.ethereum or personal_sign methods.
    - Scraping or exfiltration of BIP-39 mnemonic phrases.

routing:
  escalation_route:
    - "security_analyst"
    - "endpoint_engineer"
    - "ciso"

governance:
  evaluation_threshold: "HIGH"
  approved_artifact_hash: "pending-evaluation"
